name: Desktop release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      # A tag that disagrees with the packaged version publishes a release
      # no installed client will ever consider an update — a silent failure
      # otherwise discovered only by a user who never gets updated.
      - name: Check tag matches desktop version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#desktop-v}"
          PKG="$(node -p "require('./desktop/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag ${GITHUB_REF_NAME} implies version ${TAG}, but desktop/package.json is ${PKG}" >&2
            exit 1
          fi
          # A semver prerelease (0.2.0-beta.1) has to be flagged prerelease on
          # the GitHub release itself. electron-updater's default channel
          # resolves through /releases/latest, which filters on that flag and
          # not on the version string — without this a beta is offered to
          # everyone on a stable build.
          case "$TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Install dependencies
        run: npm ci
      - name: Build app
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: dist
          retention-days: 1

  package:
    name: Package (${{ matrix.os }})
    needs: build-web
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one platform must not throw away another's good artifact.
      fail-fast: false
      # macos-latest is Apple Silicon, which is the only architecture the mac
      # block in desktop/package.json builds for.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      # The web app is built once, on Linux, and handed to both runners. The
      # Windows runner never touches the root manifest, so npm's known
      # platform-specific optional-dependency problems with a Linux-generated
      # lockfile cannot break the Windows package.
      - name: Download web build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-dist
          path: dist
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Package and publish
        if: runner.os != 'macOS'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_PRE_RELEASE: ${{ needs.build-web.outputs.prerelease }}
        run: npx electron-builder --publish always
      # The signing and notarization credentials are scoped to this step rather
      # than shared with the one above. CSC_LINK is not a macOS-only variable —
      # electron-builder reads it on Windows for Authenticode as well, and
      # getCscLink() treats an empty string as a value rather than as unset, so
      # there is no way to expose these to a shared step and have the Windows
      # runner ignore them. It would try to sign the NSIS installer with a
      # Developer ID certificate and fail the build.
      - name: Package and publish (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_PRE_RELEASE: ${{ needs.build-web.outputs.prerelease }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # A missing secret otherwise surfaces as a keychain or notarytool
          # error deep inside electron-builder, or — worse — as a published
          # release that installs and then never updates, because Squirrel.Mac
          # silently refuses an unsigned bundle.
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_B64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [ -z "${!var}" ]; then
              echo "Repository secret for ${var} is missing or empty" >&2
              exit 1
            fi
          done
          # @electron/notarize hands APPLE_API_KEY to `notarytool --key`, which
          # wants the path to the .p8 file and not its contents. The secret
          # holds base64 because the key is multi-line PEM, so decode it to a
          # file that leaves with the runner.
          KEY_DIR="$(mktemp -d)"
          trap 'rm -rf "${KEY_DIR}"' EXIT
          printf '%s' "${APPLE_API_KEY_B64}" | base64 --decode > "${KEY_DIR}/AuthKey.p8"
          export APPLE_API_KEY="${KEY_DIR}/AuthKey.p8"
          npx electron-builder --publish always
