# Source of truth for ios/LoafChat.xcodeproj. Edit this, then regenerate:
#
#   mise x -- xcodegen --spec ios/project.yml
#
# The generated project is committed rather than built on demand because
# Xcode Cloud builds straight from the repository and never runs XcodeGen.
# Hand edits to the .xcodeproj are overwritten on the next generate.
name: LoafChat
options:
  bundleIdPrefix: moe.loaf
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 6W2A5N37N3
    CODE_SIGN_STYLE: Automatic
    # The sources were written against Swift 5 language mode (they built with
    # plain swiftc, which defaults to it). Swift 6 mode turns the MainActor
    # warnings in WebViewController into errors; migrate deliberately, not as
    # a side effect of generating a project.
    SWIFT_VERSION: '5.0'
    # MARKETING_VERSION is the user-visible version and is bumped by hand.
    # CURRENT_PROJECT_VERSION is overwritten by Xcode Cloud with its own
    # build number on every TestFlight build, so it only matters locally.
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'

targets:
  LoafChat:
    type: application
    platform: iOS
    sources:
      - path: LoafChat
        excludes:
          - Info.plist
      # A folder reference, not a group: dist/ has to land at the top of the
      # bundle as a real directory, where AppDelegate looks for it
      # (Bundle.main.bundleURL/dist). Staged by `mise run ios-bundle`, and
      # gitignored -- a fresh clone fails the build here until it has run.
      - path: Resources/dist
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: moe.loaf.chat.ios
        INFOPLIST_FILE: LoafChat/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    # Shared scheme: Xcode Cloud only sees schemes committed to the repo.
    scheme: {}
